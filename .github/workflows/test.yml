name: Test Loudhailer

on:
  push:
    branches: '*'
    tags:
        - '*'
  pull_request:
    branches: [ master ]

jobs:
  test:
    name: "Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10"]
    services:
      rabbit:
        image: rabbitmq:3.8-management-alpine
        ports:
        - 5672:5672
        env:
          RABBITMQ_DEFAULT_USER: admin
          RABBITMQ_DEFAULT_PASS: 1q2w3e
          RABBITMQ_DEFAULT_VHOST: loudhailer
        options: >-
          --hostname rabbit
          --health-cmd "rabbitmq-diagnostics -q check_port_connectivity"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
        - 6379:6379
        options: >-
          --hostname redis
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --only-binary :all: poetry==1.8.5
        poetry install
    - name: Linting
      run: |
        poetry run flake8
    - name: E2E tests
      # Explicit 127.0.0.1, not "localhost": on this runner "localhost" can
      # resolve to ::1 first, and the AMQP/Redis clients here take whatever
      # address resolves first with no fallback - if that's an unreachable
      # ::1, the connect hangs rather than failing fast, since
      # RMQBackend.connect() has no timeout of its own to survive that hang.
      # heartbeat=2&timeout=10 on the AMQP URL: RMQBackend.disconnect() calls
      # channel.close()/connection.close() with no timeout of its own, and if
      # the broker never sends the close ack the job hangs forever. aiormq
      # itself already bounds these waits internally, but off two different,
      # URL-configurable knobs: Channel._on_close() times out its close-ack
      # wait using the negotiated heartbeat (default 60s, unbounded if
      # disabled); Connection.close()'s reader task times out via its
      # FrameReceiver, driven by the separate "timeout" param (default 60,
      # effective wait (timeout+1)*3). Both timeouts are swallowed internally
      # by aiormq, so shortening them just makes close() return promptly
      # instead of hanging - no library code change needed.
      env:
        RABBITMQ_URL: amqp://admin:1q2w3e@127.0.0.1/loudhailer?heartbeat=2&timeout=10
        REDIS_URL: redis://127.0.0.1
      run: |
        timeout 120 poetry run pytest -v -s tests/e2e/test_channels.py
        timeout 120 poetry run pytest -v -s tests/e2e/test_loudhailer.py
    - name: Unit tests
      run: |
        poetry run pytest --ignore-glob=**/e2e

  sonar:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary :all: poetry==1.8.5
          poetry install
      - name: Generate coverage report
        run: |
          poetry run pytest --ignore-glob=**/e2e
      - name: Fix coverage.xml for Sonar
        run: |
          sed -i 's/\/home\/runner\/work\/loudhailer\/loudhailer\//\/github\/workspace\//g' coverage.xml
      - name: SonarCloud
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: SonarQube Quality Gate check
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}